<!doctype html>
<html lang="pt-BR" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/shield.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DepGuard AI - Análise Inteligente de Dependências para projetos Node.js. Detecta versões vulneráveis, depreciadas e suspeitas."
    />
    <meta name="color-scheme" content="light dark" />
    <title>DepGuard AI — Análise de Dependências Node.js</title>
    <script>
      // Aplica o tema antes da primeira renderização para evitar "flash" branco.
      (function () {
        try {
          var stored = localStorage.getItem('depguard-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored ? stored === 'dark' : prefersDark;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* localStorage indisponível: segue com o tema do sistema */
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
